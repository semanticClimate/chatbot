<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Climate Academy — chat</title>
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1 class="app-title">Climate Academy chat</h1>
      <p class="app-subtitle">Book-grounded answers via your API below.</p>
    </header>

    <section class="panel panel-settings" aria-label="Connection">
      <label class="field">
        <span class="field-label">API base URL</span>
        <input type="url" id="apiBaseUrl" class="field-input" placeholder="http://127.0.0.1:8800" autocomplete="off" />
      </label>
      <div class="row-actions row-actions-primary">
        <button type="button" id="btnHealth" class="btn btn-secondary">Check health</button>
        <button type="button" id="btnClear" class="btn btn-secondary">Clear chat</button>
      </div>
      <details class="settings-more">
        <summary class="settings-more-summary">Export CSV…</summary>
        <div class="row-actions row-actions-secondary">
          <button type="button" id="btnExportChat" class="btn btn-secondary">Download chat</button>
          <button type="button" id="btnExportLogs" class="btn btn-secondary">Server logs</button>
        </div>
      </details>
      <p id="statusLine" class="status-line" role="status"></p>
    </section>

    <main class="main-grid">
      <div class="main-middle">
        <section class="panel panel-chat" aria-label="Conversation">
          <div id="thread" class="thread"></div>
          <div id="examplesMount" class="examples-mount" aria-label="Sample questions by language"></div>
          <form id="composer" class="composer">
            <label class="sr-only" for="question">Your question</label>
            <textarea id="question" class="composer-input" rows="2" placeholder="Ask about the book…" required></textarea>
            <button type="submit" class="btn btn-primary" id="btnSend">Send</button>
          </form>
        </section>

        <aside class="panel panel-sources" id="sourcesPanel" aria-label="Sources">
          <h2 class="panel-heading">Sources</h2>
          <p class="sources-hint">Click a citation number on an answer.</p>
          <div id="sourcesDetail" class="sources-detail"></div>
        </aside>
      </div>

      <section class="panel panel-book" aria-label="Student book">
        <div class="book-toolbar">
          <h2 class="panel-heading">Student book</h2>
          <button type="button" id="btnResetBook" class="btn btn-secondary">
            Reset highlight
          </button>
        </div>
        <iframe
          id="bookFrame"
          class="book-frame"
          title="Climate Academy Student Book"
          sandbox="allow-scripts allow-same-origin"
        ></iframe>
      </section>
    </main>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
