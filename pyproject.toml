# Climate chatbot monorepo manifest
# Created: 2026-06-25 (system date of generation)

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "climate-chatbot"
version = "0.1.0a1"
description = "Grounded climate chat — FastAPI RAG backend and static browser frontend"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "semanticClimate" }]
keywords = ["climate", "rag", "chatbot", "ipcc", "fastapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Education",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "beautifulsoup4==4.12.3",
    "chromadb==0.5.3",
    "posthog<3.0.0",
    "sentence-transformers==3.0.1",
    "groq==0.9.0",
    "httpx==0.27.0",
    "pymupdf==1.24.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "lxml>=5.2.0",
    'tomli>=2.0.0; python_version < "3.11"',
]

[project.optional-dependencies]
streamlit = [
    "streamlit==1.36.0",
]
dev = [
    "pytest>=8.0",
]

[project.urls]
Homepage = "https://github.com/semanticclimate/chatbot"
Repository = "https://github.com/semanticclimate/chatbot"
Issues = "https://github.com/semanticclimate/chatbot/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["climate_streamlit*", "fastapi_app*"]

# Product layout and versioned contracts (not Python package metadata).
# Bump [project].version on each release; bump api_contract_version only when
# /ask or /book/* JSON shapes change incompatibly.
[tool.chatbot]
frontend_path = "web_client"
backend_package = "climate_streamlit"
runtime_config = "climate_streamlit/config/app.defaults.toml"
api_contract_version = "1"
index_schema_version = "para-anchor-v3"
